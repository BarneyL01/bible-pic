name: bible_pic
description: Personal Bible verse app — verses on photos, topics, themes, home-screen widget, backup.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  uuid: ^4.6.0
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  path: ^1.9.1
  image: ^4.10.1
  auto_size_text: ^3.0.0
  home_widget: ^0.10.0
  archive: ^4.3.0
  share_plus: ^13.3.1
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ">=2.4.0 <2.15.2" # 2.15.2+ needs meta ^1.18.3; the Flutter SDK pins meta 1.18.0
  drift_dev: ^2.35.1

flutter:
  uses-material-design: true
